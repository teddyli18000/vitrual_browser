<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer talks to nothing but the loopback API. `style-src` needs 'unsafe-inline'
      because Element Plus and Vue's `:style` bindings emit inline style attributes; everything
      else is first-party. `connect-src 'self'` also covers the dev server's same-origin HMR
      websocket, and the API is reached over http://127.0.0.1:<port>.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>VFox 指纹浏览器</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
