# electron-builder configuration for the Windows desktop app.
#
# Classification that makes this file correct (electron-vite convention):
#   dependencies    -> externalized, shipped in node_modules (camoufox-js, playwright-core:
#                      runtime data files + a napi module, they must not be bundled)
#   devDependencies -> bundled into out/** (everything else, including the @vfox/* workspace
#                      packages and the whole renderer stack)
# So the packaged app is `out/**` + `package.json` + the two runtime dependencies, nothing more.
#
# Install behaviour is deliberately boring and per-user: no elevation, no admin, no HKLM, no
# file associations, no protocol handlers, no auto-start, no scheduled task, no service.

appId: io.github.vfox.desktop
productName: VFox
copyright: MIT © VFox contributors

directories:
  output: release
  # `build/` is gitignored repo-wide, so the icons live in `resources/` instead — the same
  # directory that extraResources ships, which keeps one icon file for builder and runtime.
  buildResources: resources

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

extraResources:
  - from: resources
    to: .
    filter: ['**/*']

asar: true
# Native addons (impit, pulled in by camoufox-js) cannot be dlopen'd from inside an asar.
asarUnpack:
  - '**/*.node'
  # camoufox-js reads this SQLite database with a NATIVE driver (better-sqlite3), and native code
  # does not go through Electron's asar shim — the shim patches Node's fs layer, while the driver
  # calls into libuv directly. Electron's own documentation lists exactly which APIs need the file
  # to be real: `fs.open`, `fs.openSync` and `process.dlopen` "rely on passing the real file path
  # to underlying system calls".
  #
  # Verified against the shipped v0.2.0 package, not inferred: `webgl_data.db` was inside
  # `app.asar` (the header names it) and `app.asar.unpacked` held only better-sqlite3's own files,
  # so every profile creation died with SQLITE_CANTOPEN "unable to open database file". No CI job
  # had ever launched a browser from the packaged artifact, which is why it reached a user.
  # The WHOLE package, not just its data files: `dist/webgl/sample.js` computes its SQLite path
  # from its own module URL, so it must be LOADED from a real directory, not merely have its data
  # file unpacked beside the archive. `packages/core/src/camoufox.ts` redirects every import of this
  # The WHOLE dependency tree, not a selected subset of it. Earlier attempts unpacked only the
  # packages this repo imports directly, and that shipped broken: `camoufox-js/dist/pkgman.js`
  # opens with `import AdmZip from "adm-zip"`, and once camoufox-js itself is loaded from
  # `app.asar.unpacked/node_modules/camoufox-js`, Node resolves `adm-zip` upward FROM THERE -
  # where it does not exist if only camoufox-js was unpacked. v0.3.4 failed every install for
  # exactly that reason, and the user hit it, not CI: CI runs inside the repository, whose root
  # `node_modules` sits above the unpacked path, so module resolution accidentally succeeded.
  # A user's Downloads folder has no such ancestor.
  #
  # `**/*.node` is still listed separately for documentation: native modules must be real files
  # for `process.dlopen`, and saying so where the first packaging bug is recorded is worth the
  # redundancy. Keeping the whole tree outside the asar costs disk space and startup time and
  # buys the absence of a whole class of "works in CI, fails on a user's machine" defects.
  - '**/node_modules/**'
  - '**/*.node'
# The UI ships zh-CN + en only. Chromium's 55 locale packs are ~46 MB of dead weight in an
# installer that is otherwise dominated by the Electron runtime.
electronLanguages:
  - en-US
  - zh-CN

# The installer is ~90 % Electron runtime, so it compresses well and the download size matters
# more than a few seconds of CI time.
compression: maximum

# Fuses are flipped by electron-builder itself, after packing and before signing, so every
# artifact (nsis and zip alike) carries them. Without this the shipped VFox.exe is a generic
# Node interpreter for any local process: ELECTRON_RUN_AS_NODE=1, NODE_OPTIONS and --inspect
# all become code-execution vectors.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: resources/icon.png
  requestedExecutionLevel: asInvoker
  # The zip target reuses this name; nsis overrides it below. The CI release passes explicit
  # targets and its own output dir, which win over these values.
  artifactName: VFox-${version}-portable.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: VFox
  artifactName: VFox-Setup-${version}.exe

# No native module is rebuilt for Electron: impit ships prebuilt napi binaries, and this
# project must be buildable on a machine without an MSVC toolchain.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
