name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repository default workflow permission is `read`; state it explicitly so no job can
# silently gain more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep every large download inside the workspace. windows-latest has ~14 GB free on C:
  # but a far larger D: (where github.workspace lives), and actions/cache only takes
  # workspace-relative paths. scripts/*.mjs apply the same defaults when these are unset.
  CAMOUFOX_INSTALL_DIR: ${{ github.workspace }}/.cache/camoufox
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright

jobs:
  validate:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup

      # @vfox/core, @vfox/server and @vfox/cli resolve @vfox/shared through its built
      # `dist/`, so the frozen contract has to exist before anything typechecks.
      - name: Build the frozen contract
        run: pnpm --filter @vfox/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Enforces the supply-chain rule that every third-party action stays pinned to a full
      # commit SHA, and that no workflow references a path that does not exist.
      - name: Validate the workflows
        run: node scripts/validate-workflows.mjs

      # Instant, static, and needs no build: it catches a broken Element Plus component
      # registration before any of the slow steps run.
      - name: Check the UI component registration
        uses: ./.github/actions/gated-script
        with:
          label: check-ui
          script: apps/desktop/scripts/check-ui-registration.mjs

      # Builds packages/* and the desktop renderer BEFORE the tests. Several packages' `test`
      # scripts run `tsc -b` first, so without this a compile error in @vfox/core would be
      # reported as "@vfox/server's tests failed" — the wrong file, and a real misattribution
      # risk. The installer is deliberately NOT built here: it is release-only work.
      - name: Build packages and the desktop renderer
        run: pnpm build

      # The only thing that proves the GUI can actually talk to the API — it found the CORS
      # bug that would have shipped as a permanent "核心服务未连接" banner. Browser-free by
      # design: `--launch` opens a real browser and is deliberately not passed here.
      - name: Smoke the HTTP API end to end
        uses: ./.github/actions/gated-script
        with:
          label: smoke-api
          script: apps/desktop/scripts/smoke-api.mjs

      # `pnpm -r run test` stops at the first failing package, which hides whether every other
      # package even ran; `--no-bail` would instead exit 0 even when a suite fails. test-all.mjs
      # runs every suite, names each result, and still fails.
      - name: Test every workspace package
        run: node scripts/test-all.mjs

  e2e-engine:
    name: engine launch and fingerprint smoke test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Report free disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Used -ne $null } |
            ForEach-Object { '{0}: {1:N1} GB free of {2:N1} GB' -f $_.Name, ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB) }

      # The cache key is the engine version itself, resolved from camoufox-js's own release
      # lookup — not the lockfile hash. That way the ~550 MB engine is re-downloaded exactly
      # when the engine changes, and never on an unrelated push. There are deliberately no
      # restore-keys: restoring a stale engine would cost a full 550 MB transfer and then be
      # replaced anyway.
      - name: Resolve the Camoufox engine version
        id: engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = (node scripts/kernel-version.mjs).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not resolve the Camoufox engine version; `camoufox fetch` would fail too.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Camoufox engine version: $version"

      - name: Restore the Camoufox engine
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.engine.outputs.version }}

      # GITHUB_TOKEN is not optional: `camoufox-js` authenticates its api.github.com release lookup
      # with it when present (dist/pkgman.js `getAuthorizationHeaders`). Without it the lookup
      # shares the unauthenticated 60-per-hour per-IP budget, and whichever job runs second is the
      # one that gets rate-limited — which is how `e2e-window` failed on 2026-10-04 with
      # "Failed to fetch releases from api.github.com/repos/daijro/camoufox/releases after 5 attempts".
      # Proves the direct CDN download URL still resolves, even when the engine cache is warm
      # and the fetch below is skipped. Runs before the restore so it is never cached away.
      - name: Verify the engine download URL
        run: node scripts/fetch-kernel.mjs --verify-url

      # The engine fetch now delegates to the application's own installer (packages/core/dist), so
      # the workspace must be built first — CI then proves the code a user's 一键安装 button runs,
      # rather than a second implementation of the same download that only CI exercises.
      - name: Build the workspace before fetching the engine
        run: pnpm --filter @vfox/shared build && pnpm --filter @vfox/core build && pnpm --filter @vfox/server build
      - name: Fetch the Camoufox engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-kernel.mjs

      # Engine updates change which config keys are accepted. Engine 156 dropped canvas:aaOffset,
      # the tolerance path dropped the pin, and a profile silently lost its canvas stability. Print the
      # surface so the cause is readable from the log instead of inferred across a CI cycle.
      - name: Report the engine fingerprint surface
        run: node scripts/engine-surface.mjs

      - name: Build the workspace
        run: pnpm --filter @vfox/shared build && pnpm --filter @vfox/core build && pnpm --filter @vfox/server build && pnpm --filter @vfox/sync build

      - name: Launch the engine and verify fingerprint spoofing
        uses: ./.github/actions/engine-smoke
        with:
          headless: '1'

      # packages/sync was the only shipped feature with no end-to-end evidence: unit tests
      # against a fake Playwright layer plus a smoke script that had never executed anywhere.
      # It launches two real profiles and drives a real session, so it runs here where the
      # engine is already fetched — a sibling job would restore the same ~1 GB cache for
      # nothing. Its contract is its exit code, so it uses the generic gated runner.
      - name: Verify the window synchroniser with two real browsers
        uses: ./.github/actions/gated-script
        env:
          VFOX_SMOKE_HEADLESS: '1'
        with:
          label: sync
          script: packages/sync/scripts/smoke-sync.mjs

  # Electron itself cannot run on the developer machine (the sandbox blocks the child stdio
  # it needs, and the DSH harness injects ELECTRON_RUN_AS_NODE=1 into every shell), so the UI
  # is screenshotted here: the built renderer is driven by headless Chromium against the real
  # @vfox/server, with the preload bridge injected.
  ui-screenshots:
    name: UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build the workspace the renderer talks to
        # @vfox/sync is built too: startServer imports it lazily and the screenshot harness starts a
        # real server, so a missing sync build would kill this job with ERR_MODULE_NOT_FOUND.
        run: pnpm --filter @vfox/shared build && pnpm --filter @vfox/core build && pnpm --filter @vfox/sync build && pnpm --filter @vfox/server build

      # Keyed on the pinned Playwright version rather than the lockfile hash: the ~130 MB
      # Chromium download then survives every unrelated dependency change.
      - name: Resolve the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(node -e "const p=require('./apps/desktop/package.json');console.log((p.devDependencies&&p.devDependencies.playwright)||(p.dependencies&&p.dependencies.playwright)||'unpinned')")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      - name: Restore the Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Chromium the screenshot script drives
        run: pnpm --filter @vfox/desktop exec playwright install --with-deps chromium

      - name: Build the renderer
        run: pnpm --filter @vfox/desktop build

      - name: Capture the UI screenshots
        run: node apps/desktop/scripts/screenshot-ui.mjs

      # `if: always()` so the screenshots of a failing run are still retrievable — they are the
      # evidence used to diagnose it. `error` (not `warn`) because "no PNGs" is itself a failure:
      # a run that produces nothing to look at has not verified the UI.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: apps/desktop/.cache/shots/*.png
          if-no-files-found: error
          retention-days: 30

  # The install path a brand-new user hits first, run for real on a clean machine with NO engine
  # cache to hide behind. Two bugs reached a user exactly here and neither was catchable by a unit
  # test, a typecheck or a build: a stream drain race that crashed the Electron main process at
  # "100% · 469 MB / 470 MB", and a rate-limited GeoIP lookup that reported the whole install as
  # failed after the engine was already correctly installed. This job downloads ~490 MB on purpose.
  e2e-install:
    name: engine install from scratch
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build the workspace
        run: pnpm --filter @vfox/shared build && pnpm --filter @vfox/core build

      # Deliberately no actions/cache for the engine: a warm cache would skip the download, and the
      # download is where both bugs lived.
      - name: Install the engine into an empty directory
        run: node packages/core/scripts/verify-install.mjs
  # The only visual evidence this project has. Everything else measures fingerprints or pixels of a
  # renderer; this job opens a REAL, VISIBLE browser window on a runner and photographs the desktop,
  # so "can it be used like a normal browser window?" is answered by a picture.
  #
  # VFOX_SMOKE_HEADLESS is deliberately absent from this job — headless is the thing being ruled out.
  e2e-window:
    name: headed window and desktop screenshot
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup

      # The cache key is deliberately IDENTICAL to e2e-engine's, so this job reuses the engine
      # that job already downloaded instead of fetching another 550 MB.
      - name: Resolve the Camoufox engine version
        id: engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = (node scripts/kernel-version.mjs).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not resolve the Camoufox engine version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Camoufox engine version: $version"

      - name: Restore the Camoufox engine
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.engine.outputs.version }}

      # Same authentication requirement as e2e-engine's fetch step above: without GITHUB_TOKEN the
      # `camoufox-js` release lookup shares the unauthenticated per-IP budget and this job — the
      # second one to run — is the one that gets rate-limited.
      # Proves the direct CDN download URL still resolves, even when the engine cache is warm
      # and the fetch below is skipped. Runs before the restore so it is never cached away.
      - name: Verify the engine download URL
        run: node scripts/fetch-kernel.mjs --verify-url

      # The engine fetch now delegates to the application's own installer (packages/core/dist), so
      # the workspace must be built first — CI then proves the code a user's 一键安装 button runs,
      # rather than a second implementation of the same download that only CI exercises.
      - name: Build the workspace before fetching the engine
        run: pnpm --filter @vfox/shared build && pnpm --filter @vfox/core build && pnpm --filter @vfox/server build
      - name: Fetch the Camoufox engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-kernel.mjs

      # Engine updates change which config keys are accepted. Engine 156 dropped canvas:aaOffset,
      # the tolerance path dropped the pin, and a profile silently lost its canvas stability. Print the
      # surface so the cause is readable from the log instead of inferred across a CI cycle.
      - name: Report the engine fingerprint surface
        run: node scripts/engine-surface.mjs

      - name: Build the workspace
        run: pnpm --filter @vfox/shared build && pnpm --filter @vfox/core build && pnpm --filter @vfox/server build

      # Pre-flight, before any browser: does the user32/koffi layer load, and does this runner have
      # any visible top-level windows at all? It exits 0 even with zero windows — an empty list here
      # plus a blank baseline capture is the unambiguous "this runner has no interactive desktop"
      # answer, which is the environment rather than the script. Exit 2 means the FFI layer itself
      # cannot load, and then the headed check below could not have run either.
      - name: Probe the Windows desktop layer
        uses: ./.github/actions/gated-script
        with:
          label: probe-windows
          script: packages/core/scripts/probe-windows.mjs

      # Taken BEFORE any browser starts, so it answers one question unambiguously: does this runner
      # have an interactive desktop at all? A blank baseline means the environment is the problem,
      # not the browser. `-AllowBlank` keeps the diagnostic itself from failing the job.
      - name: Baseline desktop capture, before any browser
        shell: pwsh
        run: pwsh -NoProfile -File scripts/capture-desktop.ps1 -Path .cache/window-shots/00-baseline-desktop.png -AllowBlank

      # `--screenshot` is handled by verify-window.mjs calling scripts/capture-desktop.ps1 at the
      # right moment — after the page has loaded and the window is in front, before teardown.
      - name: Launch a headed window and verify it
        uses: ./.github/actions/gated-script
        with:
          label: window
          script: packages/core/scripts/verify-window.mjs
          args: --screenshot .cache/window-shots/10-browser-window.png

      # Independent of the capture helper and of verify-window.mjs: reads the PNGs back and reports
      # their real dimensions, and refuses to call a missing or stub-sized file evidence.
      - name: Inspect the screenshots
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $problems = @()
          foreach ($file in @('.cache/window-shots/00-baseline-desktop.png', '.cache/window-shots/10-browser-window.png')) {
            if (-not (Test-Path $file)) { $problems += "$file is absent"; continue }
            $bytes = (Get-Item $file).Length
            if ($bytes -lt 4096) { $problems += "$file is $bytes bytes, too small to be an image"; continue }
            $image = [System.Drawing.Image]::FromFile((Resolve-Path $file).Path)
            try { Write-Host "$file  $($image.Width)x$($image.Height)  $bytes bytes" }
            finally { $image.Dispose() }
          }
          if ($problems.Count -gt 0) { throw "screenshot problems: $($problems -join '; ')" }

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-window-screenshots
          path: .cache/window-shots/*.png
          if-no-files-found: error
          retention-days: 30

  # The only job that runs the application users actually install. Every other job launches the
  # engine from source, which is how v0.2.0 shipped with `camoufox-js/dist/data-files/webgl_data.db`
  # sealed inside app.asar: better-sqlite3 is a native module, native code does not go through
  # Electron's asar shim, and every profile creation failed with SQLITE_CANTOPEN where no CI job
  # could see it.
  #
  # Deliberately NOT path-filtered, even though it is the slowest job here. The v0.2.0 defect came
  # from a *dependency's* data file being packed differently, not from a change under apps/desktop —
  # a `paths:` filter would have skipped exactly the commit that shipped the bug. What this job
  # guards is the shape of the artifact, and that can change from any package in the workspace.
  e2e-packaged:
    name: packaged app end-to-end
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup

      # Deliberately NO engine cache and NO `fetch-kernel.mjs` here, unlike e2e-engine and e2e-window.
      # The test points the app at an empty directory and makes it download the kernel itself, because
      # that first-run install is where two separate crashes have already shipped: the stream drain
      # crash at 100%, and a rate-limited GeoIP lookup that failed the whole install. Caching the
      # engine here would hide exactly the path this job exists to exercise.

      # Builds packages, the renderer, the NSIS installer and the portable zip, and leaves the
      # packaged application at release/win-unpacked — which is exactly what the test launches.
      - name: Build and package the application
        run: node scripts/build-installer.mjs

      # Fails on the structural guard (WebGL database unpacked) before it ever starts Electron, then
      # installs the kernel through the app, creates three profiles, launches all three and asserts
      # each one loads a real page. It downloads ~490 MB and extracts ~1 GB, so it is slow on purpose.
      - name: Run the packaged end-to-end test
        run: node apps/desktop/e2e/packaged-e2e.mjs --app release/win-unpacked

      # When it fails, the first question is always "what actually got packed?" — answer it in the log
      # rather than making someone download a 130 MB artifact to find out.
      - name: List the packaged resources on failure
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/win-unpacked/resources')) {
            Write-Host 'no resources directory — packaging did not get that far'
            exit 0
          }
          Write-Host '--- resources ---'
          Get-ChildItem 'release/win-unpacked/resources' | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '--- app.asar.unpacked/node_modules/camoufox-js ---'
          Get-ChildItem 'release/win-unpacked/resources/app.asar.unpacked/node_modules/camoufox-js' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName | Out-String | Write-Host
